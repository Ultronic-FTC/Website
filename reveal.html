  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V2 Reveal | Ultronic FTC Robotics</title>
  <meta name="description" content="The official reveal of Ultronic's next-generation robot." />
  <meta name="theme-color" content="#e92b31" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/favicon.ico">
  <style>
    .reveal-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Tech grid background */
    .reveal-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 51, 51, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 51, 51, 0.03) 1px, transparent 1px),
        linear-gradient(rgba(255, 51, 51, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 51, 51, 0.015) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    .reveal-page::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(255, 51, 51, 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .reveal-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
    }

    .reveal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 51, 51, 0.1);
      border: 1px solid rgba(255, 51, 51, 0.3);
      color: var(--color-primary);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .reveal-badge__dot {
      width: 6px;
      height: 6px;
      background: var(--color-primary);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Analog Clock */
    .clock-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 3.5rem;
    }

    .clock {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      position: relative;
      box-shadow:
        0 0 60px rgba(255, 51, 51, 0.15),
        inset 0 0 40px rgba(0, 0, 0, 0.3);
    }

    /* Clock face markers */
    .clock__face {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
    }

    /* Hour markers */
    .clock__marker {
      position: absolute;
      width: 2px;
      height: 12px;
      background: var(--color-text-secondary);
      left: 50%;
      top: 12px;
      transform-origin: 50% 128px;
      margin-left: -1px;
    }

    .clock__marker--large {
      height: 16px;
      width: 3px;
      background: var(--color-text-primary);
      margin-left: -1.5px;
    }

    .clock__marker:nth-child(1) { transform: rotate(30deg); }
    .clock__marker:nth-child(2) { transform: rotate(60deg); }
    .clock__marker:nth-child(3) { transform: rotate(90deg); }
    .clock__marker:nth-child(4) { transform: rotate(120deg); }
    .clock__marker:nth-child(5) { transform: rotate(150deg); }
    .clock__marker:nth-child(6) { transform: rotate(180deg); }
    .clock__marker:nth-child(7) { transform: rotate(210deg); }
    .clock__marker:nth-child(8) { transform: rotate(240deg); }
    .clock__marker:nth-child(9) { transform: rotate(270deg); }
    .clock__marker:nth-child(10) { transform: rotate(300deg); }
    .clock__marker:nth-child(11) { transform: rotate(330deg); }
    .clock__marker:nth-child(12) { transform: rotate(360deg); }

    /* Clock hands */
    .clock__hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: 50% 100%;
      border-radius: 2px;
    }

    .clock__hand--hour {
      width: 4px;
      height: 60px;
      background: var(--color-text-primary);
      margin-left: -2px;
    }

    .clock__hand--minute {
      width: 3px;
      height: 85px;
      background: var(--color-text-primary);
      margin-left: -1.5px;
    }

    .clock__hand--second {
      width: 2px;
      height: 95px;
      background: var(--color-primary);
      margin-left: -1px;
    }

    .clock__hand--second::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 25px;
      background: var(--color-primary);
    }

    .clock__center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: var(--color-primary);
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
    }

    /* Orbiting rings */
    .clock-container::before {
      content: '';
      position: absolute;
      inset: -25px;
      border: 1px solid rgba(255, 51, 51, 0.15);
      border-radius: 50%;
      animation: orbit-spin 30s linear infinite;
    }

    .clock-container::after {
      content: '';
      position: absolute;
      inset: -45px;
      border: 1px dashed rgba(255, 51, 51, 0.1);
      border-radius: 50%;
      animation: orbit-spin 45s linear infinite reverse;
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Countdown display */
    .reveal-countdown {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .reveal-countdown__item {
      text-align: center;
    }

    .reveal-countdown__value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .reveal-countdown__label {
      font-size: 0.7rem;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.5rem;
    }

    .reveal-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }

    .reveal-title span {
      color: var(--color-primary);
    }

    .reveal-subtitle {
      font-size: 1.125rem;
      color: var(--color-text-secondary);
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    .reveal-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .reveal-back:hover {
      color: var(--color-primary);
      gap: 0.75rem;
    }

    .reveal-back svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .reveal-back:hover svg {
      transform: translateX(-3px);
    }

    /* Floating particles */
    .reveal-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .reveal-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--color-primary);
      border-radius: 50%;
      opacity: 0;
      animation: particle-float 5s ease-in-out infinite;
    }

    .reveal-particle:nth-child(1) { left: 5%; top: 20%; animation-delay: 0s; }
    .reveal-particle:nth-child(2) { left: 15%; top: 70%; animation-delay: 0.7s; }
    .reveal-particle:nth-child(3) { left: 85%; top: 25%; animation-delay: 1.4s; }
    .reveal-particle:nth-child(4) { left: 75%; top: 75%; animation-delay: 2.1s; }
    .reveal-particle:nth-child(5) { left: 50%; top: 5%; animation-delay: 2.8s; }
    .reveal-particle:nth-child(6) { left: 25%; top: 90%; animation-delay: 3.5s; }
    .reveal-particle:nth-child(7) { left: 95%; top: 50%; animation-delay: 4.2s; }
    .reveal-particle:nth-child(8) { left: 3%; top: 55%; animation-delay: 4.9s; }
    .reveal-particle:nth-child(9) { left: 40%; top: 85%; animation-delay: 1s; }
    .reveal-particle:nth-child(10) { left: 60%; top: 15%; animation-delay: 2s; }

    @keyframes particle-float {
      0%, 100% {
        opacity: 0;
        transform: translateY(0) scale(0);
      }
      15% {
        opacity: 0.6;
        transform: translateY(0) scale(1);
      }
      85% {
        opacity: 0.6;
        transform: translateY(-40px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(0);
      }
    }

    /* ========== GLITCH REVEAL STYLES ========== */

    /* Overlay */
    .reveal-overlay {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.3s ease;
    }

    .reveal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Static noise overlay */
    .reveal-static {
      position: fixed;
      inset: 0;
      z-index: 1002;
      pointer-events: none;
      opacity: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .reveal-static.active {
      opacity: 0.15;
      animation: static-flicker 50ms steps(10) infinite;
    }

    @keyframes static-flicker {
      0%, 100% { opacity: 0.15; transform: translateX(0); }
      25% { opacity: 0.2; transform: translateX(-1px); }
      50% { opacity: 0.1; transform: translateX(1px); }
      75% { opacity: 0.18; transform: translateX(0); }
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1003;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      transition: opacity 0.2s ease;
    }

    .scanlines.active {
      opacity: 1;
      animation: scanlines-move 8s linear infinite;
    }

    @keyframes scanlines-move {
      0% { background-position: 0 0; }
      100% { background-position: 0 100vh; }
    }

    /* Screen tear effect */
    .screen-tear {
      position: fixed;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 51, 51, 0.8);
      z-index: 1004;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
    }

    .screen-tear.active {
      animation: tear-move 0.15s steps(3) forwards;
    }

    @keyframes tear-move {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 1; }
    }

    /* Faded logo behind glitch text */
    .reveal-overlay-logo {
      position: absolute;
      width: clamp(200px, 40vw, 400px);
      height: auto;
      opacity: 0;
      filter: grayscale(100%) brightness(0.5);
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.3s ease;
    }

    .reveal-overlay.active .reveal-overlay-logo {
      opacity: 0.08;
      animation: logo-pulse 3s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { opacity: 0.06; filter: grayscale(100%) brightness(0.5); }
      50% { opacity: 0.12; filter: grayscale(100%) brightness(0.6); }
    }

    /* Glitch text */
    .reveal-glitch-text {
      font-size: clamp(0.75rem, 2vw, 1rem);
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.5em;
      font-family: 'Courier New', monospace;
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .reveal-glitch-text.visible {
      opacity: 1;
    }

    .reveal-glitch-text.glitch {
      animation: text-glitch 0.4s steps(2) infinite;
    }

    @keyframes text-glitch {
      0%, 100% {
        transform: translateX(0);
        text-shadow: -2px 0 #00ffff, 2px 0 #ff0040;
      }
      25% {
        transform: translateX(-3px) skewX(-2deg);
        text-shadow: -3px 0 #00ffff, 3px 0 #ff0040;
      }
      50% {
        transform: translateX(3px) skewX(1deg);
        text-shadow: -1px 0 #00ffff, 1px 0 #ff0040;
      }
      75% {
        transform: translateX(-1px) skewX(-1deg);
        text-shadow: -4px 0 #00ffff, 4px 0 #ff0040;
      }
    }

    /* Chromatic aberration on whole screen */
    .chromatic-active {
      animation: chromatic-screen 0.1s steps(2) infinite;
    }

    @keyframes chromatic-screen {
      0%, 100% { filter: none; }
      50% { filter: url('#chromatic-aberration'); }
    }

    /* Flash */
    .reveal-flash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
    }

    .reveal-flash.active {
      animation: flash-burst 0.2s steps(3) forwards;
    }

    @keyframes flash-burst {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 0; }
    }

    /* Big title with heavy glitch */
    .reveal-big-title {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(3rem, 15vw, 12rem);
      font-weight: 800;
      color: var(--color-primary);
      z-index: 100;
      opacity: 0;
      text-shadow:
        0 0 60px rgba(255, 51, 51, 0.8),
        0 0 120px rgba(255, 51, 51, 0.4);
      letter-spacing: 0.05em;
      white-space: nowrap;
      pointer-events: none;
    }

    .reveal-big-title.visible {
      opacity: 1;
      animation: title-glitch-in 0.6s steps(3) forwards;
    }

    @keyframes title-glitch-in {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5);
        filter: blur(20px);
      }
      20% {
        opacity: 1;
        transform: translate(-52%, -48%) scale(1.02);
        filter: blur(0);
      }
      40% {
        transform: translate(-48%, -52%) scale(0.98);
      }
      60% {
        transform: translate(-51%, -49%) scale(1.01);
      }
      80% {
        transform: translate(-49%, -51%) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
      }
    }

    .reveal-big-title.visible::before,
    .reveal-big-title.visible::after {
      content: 'HAWKEYE';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .reveal-big-title.visible::before {
      color: #00ffff;
      z-index: -1;
      animation: chromatic-left 0.8s ease-out forwards;
    }

    .reveal-big-title.visible::after {
      color: #ff0040;
      z-index: -1;
      animation: chromatic-right 0.8s ease-out forwards;
    }

    @keyframes chromatic-left {
      0% { transform: translateX(-20px); opacity: 1; clip-path: inset(0 0 50% 0); }
      50% { transform: translateX(-10px); opacity: 0.8; }
      100% { transform: translateX(0); opacity: 0; }
    }

    @keyframes chromatic-right {
      0% { transform: translateX(20px); opacity: 1; clip-path: inset(50% 0 0 0); }
      50% { transform: translateX(10px); opacity: 0.8; }
      100% { transform: translateX(0); opacity: 0; }
    }

    .reveal-big-title.glitch-hold {
      animation: title-glitch-hold 0.15s steps(2) infinite;
    }

    @keyframes title-glitch-hold {
      0%, 100% {
        transform: translate(-50%, -50%);
        text-shadow: -3px 0 #00ffff, 3px 0 #ff0040, 0 0 60px rgba(255, 51, 51, 0.8);
      }
      50% {
        transform: translate(-51%, -49%);
        text-shadow: 3px 0 #00ffff, -3px 0 #ff0040, 0 0 80px rgba(255, 51, 51, 1);
      }
    }

    .reveal-big-title.exit {
      animation: title-glitch-out 0.5s steps(4) forwards;
    }

    @keyframes title-glitch-out {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      25% { opacity: 0.8; transform: translate(-48%, -52%) scale(1.02); }
      50% { opacity: 0.5; transform: translate(-52%, -48%) scale(0.98); }
      75% { opacity: 0.2; transform: translate(-50%, -55%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
    }

    /* Clock glitch effects */
    .clock.glitching {
      animation: clock-glitch 0.1s steps(2) infinite;
    }

    @keyframes clock-glitch {
      0%, 100% {
        transform: translateX(0);
        box-shadow: 0 0 60px rgba(255, 51, 51, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.3);
      }
      50% {
        transform: translateX(2px);
        box-shadow: -3px 0 20px rgba(0, 255, 255, 0.3), 3px 0 20px rgba(255, 0, 64, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.3);
      }
    }

    .clock.spin-crazy .clock__hand--second {
      animation: crazy-spin 0.1s linear infinite !important;
    }

    .clock.spin-crazy .clock__hand--minute {
      animation: crazy-spin 0.15s linear infinite reverse !important;
    }

    .clock.spin-crazy .clock__hand--hour {
      animation: crazy-spin 0.2s linear infinite !important;
    }

    @keyframes crazy-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Content with glitch transition */
    .reveal-content.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .reveal-content.glitch-in {
      animation: content-glitch-in 0.8s steps(4) forwards;
    }

    @keyframes content-glitch-in {
      0% {
        opacity: 0;
        transform: translateX(-20px);
        filter: blur(10px);
      }
      25% {
        opacity: 0.5;
        transform: translateX(15px);
        filter: blur(5px);
      }
      50% {
        opacity: 0.8;
        transform: translateX(-10px);
        filter: blur(2px);
      }
      75% {
        opacity: 0.9;
        transform: translateX(5px);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }

    /* Particle burst */
    .reveal-particle.burst {
      animation: particle-burst 0.8s ease-out forwards !important;
    }

    @keyframes particle-burst {
      0% {
        transform: translate(0, 0) scale(3);
        opacity: 1;
      }
      100% {
        transform: translate(var(--burst-x, 0), var(--burst-y, 0)) scale(0);
        opacity: 0;
      }
    }

    .reveal-particle:nth-child(1) { --burst-x: -200px; --burst-y: -150px; }
    .reveal-particle:nth-child(2) { --burst-x: 180px; --burst-y: 200px; }
    .reveal-particle:nth-child(3) { --burst-x: -250px; --burst-y: 100px; }
    .reveal-particle:nth-child(4) { --burst-x: 220px; --burst-y: -180px; }
    .reveal-particle:nth-child(5) { --burst-x: -120px; --burst-y: -220px; }
    .reveal-particle:nth-child(6) { --burst-x: 160px; --burst-y: 240px; }
    .reveal-particle:nth-child(7) { --burst-x: -200px; --burst-y: -80px; }
    .reveal-particle:nth-child(8) { --burst-x: 280px; --burst-y: 60px; }
    .reveal-particle:nth-child(9) { --burst-x: -180px; --burst-y: 180px; }
    .reveal-particle:nth-child(10) { --burst-x: 140px; --burst-y: -200px; }

    /* YouTube embed container */
    .reveal-video-container {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      background: #0a0a0a;
    }

    .reveal-video-container.visible {
      opacity: 1;
      pointer-events: all;
    }

    .reveal-video-container.glitch-in {
      animation: video-glitch-in 0.8s steps(4) forwards;
    }

    @keyframes video-glitch-in {
      0% { opacity: 0; transform: translateX(-30px); }
      25% { opacity: 0.5; transform: translateX(20px); }
      50% { opacity: 0.8; transform: translateX(-15px); }
      75% { opacity: 0.9; transform: translateX(8px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .reveal-video-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background: #111;
      border: 2px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255, 51, 51, 0.3);
      display: block;
      text-decoration: none;
      cursor: pointer;
    }

    .reveal-video-wrapper .thumb-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.4);
      transition: filter 0.3s ease;
    }

    .reveal-video-wrapper:hover .thumb-bg {
      filter: brightness(0.55);
    }

    .reveal-video-wrapper .thumb-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .reveal-video-wrapper .thumb-play {
      width: 64px;
      height: 64px;
      color: #fff;
      opacity: 0.9;
      transition: transform 0.3s ease;
    }

    .reveal-video-wrapper:hover .thumb-play {
      transform: scale(1.15);
    }

    .reveal-video-wrapper .thumb-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }

    .reveal-video-title {
      margin-top: 2rem;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--color-text-primary);
      text-align: center;
    }

    .reveal-video-title span {
      color: var(--color-primary);
    }

    .reveal-video-subtitle {
      margin-top: 0.75rem;
      font-size: 1rem;
      color: var(--color-text-secondary);
      text-align: center;
    }

    .reveal-video-back {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .reveal-video-back:hover {
      color: var(--color-primary);
    }

    .reveal-video-back svg {
      width: 18px;
      height: 18px;
    }

    /* Hide original content when video is shown */
    body.video-mode .reveal-page {
      opacity: 0;
      pointer-events: none;
    }

    body.video-mode .reveal-particles {
      z-index: 51;
    }

    /* Glitch out effect for initial content */
    .reveal-content.glitch-out {
      animation: content-glitch-out 0.6s steps(4) forwards;
    }

    @keyframes content-glitch-out {
      0% { opacity: 1; transform: translateX(0); filter: blur(0); }
      25% { opacity: 0.8; transform: translateX(15px); filter: blur(2px); }
      50% { opacity: 0.5; transform: translateX(-20px); filter: blur(5px); }
      75% { opacity: 0.2; transform: translateX(10px); filter: blur(8px); }
      100% { opacity: 0; transform: translateX(-30px); filter: blur(10px); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .reveal-badge__dot,
      .clock-container::before,
      .clock-container::after,
      .reveal-particle {
        animation: none;
      }

      .reveal-particle {
        opacity: 0.4;
      }

      body.revealing,
      body.revealing .reveal-content {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="background-texture" aria-hidden="true"></div>

  <!-- Glitch reveal elements -->
  <div class="reveal-overlay">
    <img src="/img/logos/no_bg_ultronic_logo.png" alt="" class="reveal-overlay-logo" aria-hidden="true">
    <div class="reveal-glitch-text"></div>
  </div>
  <div class="reveal-static"></div>
  <div class="reveal-flash"></div>
  <div class="reveal-big-title">HAWKEYE</div>
  <div class="scanlines"></div>
  <div class="screen-tear"></div>

  <!-- YouTube video container (shown after reveal) -->
  <div class="reveal-video-container">
    <a class="reveal-video-wrapper" id="youtube-link" href="https://www.youtube.com/watch?v=nZXtCzvyQgk" target="_blank" rel="noopener">
      <div class="thumb-bg" style="background-image: url('https://img.youtube.com/vi/nZXtCzvyQgk/maxresdefault.jpg');"></div>
      <div class="thumb-overlay">
        <svg class="thumb-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span class="thumb-label">Watch on YouTube</span>
      </div>
    </a>
    <h1 class="reveal-video-title">Introducing <span>Hawkeye</span></h1>
    <p class="reveal-video-subtitle">The next evolution of competitive robotics.</p>
    <a href="/robot" class="reveal-video-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Robot
    </a>
  </div>

  <!-- Floating particles -->
  <div class="reveal-particles">
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
    <span class="reveal-particle"></span>
  </div>

  <main class="reveal-page">
    <div class="reveal-content">
      <div class="reveal-badge">
        <span class="reveal-badge__dot"></span>
        Coming Soon
      </div>

      <div class="clock-container">
        <div class="clock">
          <div class="clock__face">
            <!-- Hour markers -->
            <div class="clock__marker clock__marker--large"></div>
            <div class="clock__marker"></div>
            <div class="clock__marker clock__marker--large"></div>
            <div class="clock__marker"></div>
            <div class="clock__marker clock__marker--large"></div>
            <div class="clock__marker"></div>
            <div class="clock__marker clock__marker--large"></div>
            <div class="clock__marker"></div>
            <div class="clock__marker clock__marker--large"></div>
            <div class="clock__marker"></div>
            <div class="clock__marker clock__marker--large"></div>
            <div class="clock__marker"></div>
          </div>
          <div class="clock__hand clock__hand--hour" id="hour-hand"></div>
          <div class="clock__hand clock__hand--minute" id="minute-hand"></div>
          <div class="clock__hand clock__hand--second" id="second-hand"></div>
          <div class="clock__center"></div>
        </div>
      </div>

      <!-- Countdown -->
      <div class="reveal-countdown">
        <div class="reveal-countdown__item">
          <div class="reveal-countdown__value" id="reveal-days">--</div>
          <div class="reveal-countdown__label">Days</div>
        </div>
        <div class="reveal-countdown__item">
          <div class="reveal-countdown__value" id="reveal-hours">--</div>
          <div class="reveal-countdown__label">Hours</div>
        </div>
        <div class="reveal-countdown__item">
          <div class="reveal-countdown__value" id="reveal-mins">--</div>
          <div class="reveal-countdown__label">Mins</div>
        </div>
        <div class="reveal-countdown__item">
          <div class="reveal-countdown__value" id="reveal-secs">--</div>
          <div class="reveal-countdown__label">Secs</div>
        </div>
      </div>

      <h1 class="reveal-title">The Wait is <span>Almost Over</span></h1>
      <p class="reveal-subtitle">
        V2 is coming. February 27, 2026 at 7:00 PM EST.
      </p>

      <a href="/robot" class="reveal-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Robot
      </a>
    </div>
  </main>

  <script>
    // IIFE to prevent console access to internal functions
    (function() {
    'use strict';

    // Target date - February 27, 2026 at 7:00 PM EST
    const TARGET_DATE = Object.freeze(new Date('2026-02-27T19:00:00-05:00'));

    // ⚠️ REPLACE WITH YOUR YOUTUBE VIDEO ID
    const YOUTUBE_VIDEO_ID = 'nZXtCzvyQgk';

    // Elements
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const daysEl = $('#reveal-days');
    const hoursEl = $('#reveal-hours');
    const minsEl = $('#reveal-mins');
    const secsEl = $('#reveal-secs');
    const clock = $('.clock');
    const overlay = $('.reveal-overlay');
    const glitchText = $('.reveal-glitch-text');
    const staticNoise = $('.reveal-static');
    const flash = $('.reveal-flash');
    const bigTitle = $('.reveal-big-title');
    const scanlines = $('.scanlines');
    const screenTear = $('.screen-tear');
    const content = $('.reveal-content');
    const videoContainer = $('.reveal-video-container');
    const youtubeLink = $('#youtube-link');
    const particles = $$('.reveal-particle');

    let hasRevealed = false;

    const wait = (ms) => new Promise(r => setTimeout(r, ms));

    // Scramble text effect
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>[]{}';
    async function scrambleText(finalText, duration = 800) {
      const iterations = 10;
      const interval = duration / iterations;

      for (let i = 0; i < iterations; i++) {
        let scrambled = '';
        for (let j = 0; j < finalText.length; j++) {
          if (i > iterations * (j / finalText.length)) {
            scrambled += finalText[j];
          } else {
            scrambled += chars[Math.floor(Math.random() * chars.length)];
          }
        }
        glitchText.textContent = scrambled;
        await wait(interval);
      }
      glitchText.textContent = finalText;
    }

    // Screen tear
    async function doScreenTear() {
      screenTear.classList.add('active');
      await wait(150);
      screenTear.classList.remove('active');
    }

    // Normal clock
    function updateClock() {
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const ms = now.getMilliseconds();

      $('#second-hand').style.transform = `rotate(${(seconds + ms/1000) * 6}deg)`;
      $('#minute-hand').style.transform = `rotate(${(minutes + seconds/60) * 6}deg)`;
      $('#hour-hand').style.transform = `rotate(${(hours + minutes/60) * 30}deg)`;
    }

    // ========== GLITCH REVEAL SEQUENCE ==========
    async function triggerReveal(skipCountdownPhase = false) {
      if (hasRevealed) return;

      // Verify time with server to prevent clock manipulation
      try {
        const response = await fetch('https://worldtimeapi.org/api/timezone/America/New_York');
        const data = await response.json();
        const serverTime = new Date(data.datetime);
        if (serverTime < TARGET_DATE) {
          return; // Server says it's not time yet
        }
      } catch (e) {
        // If we can't verify server time, only allow if this is post-reveal loading screen
        // (user arrived after the time, so we're more lenient)
        if (!skipCountdownPhase) {
          return;
        }
        // For loading screen mode, fall back to local time
        if (new Date() < TARGET_DATE) {
          return;
        }
      }

      hasRevealed = true;

      if (!skipCountdownPhase) {
        // ===== PHASE 1: GLITCH OUT (1s) =====
        clock.classList.add('glitching');
        scanlines.classList.add('active');
        await wait(200);
        await doScreenTear();
        await wait(200);

        // Glitch out the content
        content.classList.add('glitch-out');
        await doScreenTear();
        await wait(400);
        await doScreenTear();
        await wait(200);
      } else {
        // Skip countdown phase - just hide content and show scanlines
        content.classList.add('hidden');
        scanlines.classList.add('active');
      }

      // ===== PHASE 2: BLACKOUT + STATIC (3s) =====
      overlay.classList.add('active');
      staticNoise.classList.add('active');
      content.classList.add('hidden');
      clock.classList.remove('glitching');
      await wait(500);

      // Glitchy text sequence
      glitchText.classList.add('visible', 'glitch');

      await scrambleText('SIGNAL LOST', 400);
      await wait(300);
      await doScreenTear();

      await scrambleText('RECONNECTING', 400);
      await wait(300);

      await scrambleText('DECRYPTING', 500);
      await wait(200);
      await doScreenTear();

      await scrambleText('BREACH DETECTED', 400);
      await wait(300);

      await scrambleText('OVERRIDE', 300);
      await wait(200);

      glitchText.classList.remove('glitch');
      await scrambleText('ACCESS GRANTED', 500);
      await wait(400);

      // ===== PHASE 3: FLASH + TITLE (2s) =====
      glitchText.classList.remove('visible');
      staticNoise.classList.remove('active');
      await wait(200);

      flash.classList.add('active');
      overlay.classList.remove('active');
      await wait(150);

      bigTitle.classList.add('visible');
      particles.forEach(p => p.classList.add('burst'));
      flash.classList.remove('active');

      await wait(600);
      bigTitle.classList.add('glitch-hold');
      await wait(200);
      await doScreenTear();
      await wait(600);
      await doScreenTear();
      await wait(400);

      // ===== PHASE 4: SHOW VIDEO (1s) =====
      bigTitle.classList.remove('glitch-hold');
      bigTitle.classList.add('exit');
      scanlines.classList.remove('active');
      await wait(400);

      // Show YouTube thumbnail link
      youtubeLink.href = `https://www.youtube.com/watch?v=${YOUTUBE_VIDEO_ID}`;
      youtubeLink.querySelector('.thumb-bg').style.backgroundImage = `url('https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/maxresdefault.jpg')`;
      document.body.classList.add('video-mode');
      videoContainer.classList.add('visible', 'glitch-in');
      particles.forEach(p => p.classList.remove('burst'));

      await wait(800);
      bigTitle.style.display = 'none';
    }

    function updateCountdown() {
      const now = new Date();
      const diff = TARGET_DATE - now;

      if (diff <= 0) {
        daysEl.textContent = '0';
        hoursEl.textContent = '00';
        minsEl.textContent = '00';
        secsEl.textContent = '00';
        triggerReveal();
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      daysEl.textContent = days;
      hoursEl.textContent = hours.toString().padStart(2, '0');
      minsEl.textContent = mins.toString().padStart(2, '0');
      secsEl.textContent = secs.toString().padStart(2, '0');
    }

    function tick() {
      if (!clock.classList.contains('spin-crazy')) {
        updateClock();
      }
      if (!hasRevealed) {
        updateCountdown();
      }
      requestAnimationFrame(tick);
    }

    // Check if we're already past the target time on page load
    if (new Date() >= TARGET_DATE) {
      // Already past time - hide content immediately, show as loading screen
      content.style.display = 'none';
      overlay.classList.add('active');
      triggerReveal(true);
    } else {
      // Start the clock tick only if countdown is needed
      tick();
    }
    })();
  </script>
  <script src="/js/teaser-banner.js"></script>
</body>

</html>
